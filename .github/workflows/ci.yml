name: CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ develop ]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE_26="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [[ -n "${XCODE_26}" ]]; then
            echo "Selecting ${XCODE_26}..."
            sudo xcode-select -s "${XCODE_26}/Contents/Developer"
          fi
          xcodebuild -version

      - name: Build and Run Unit Tests
        run: |
          xcodebuild test \
            -project Latest.xcodeproj \
            -scheme Latest \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
